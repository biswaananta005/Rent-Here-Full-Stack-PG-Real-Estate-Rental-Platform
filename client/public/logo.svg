<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="100%" height="100%">
  <defs>
    <linearGradient id="rentHereGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(5, 5)">
    <rect width="100" height="100" rx="22" fill="url(#rentHereGrad)"/>
    
    <!-- Background Skyscrapers -->
    <path d="M 28 35 L 48 22 L 48 85 L 28 85 Z" fill="#ffffff" opacity="0.45"/>
    <rect x="33" y="42" width="5" height="7" rx="1" fill="#059669"/>
    <rect x="33" y="54" width="5" height="7" rx="1" fill="#059669"/>
    
    <path d="M 48 20 L 72 26 L 72 85 L 48 85 Z" fill="#ffffff" opacity="0.7"/>
    <rect x="54" y="32" width="6" height="8" rx="1" fill="#059669"/>
    <rect x="54" y="44" width="6" height="8" rx="1" fill="#059669"/>
    <rect x="54" y="56" width="6" height="8" rx="1" fill="#059669"/>
    
    <path d="M 72 32 L 85 36 L 85 85 L 72 85 Z" fill="#ffffff" opacity="0.35"/>
    
    <!-- Foreground House -->
    <path d="M 20 62 L 50 42 L 80 62 L 72 62 L 72 86 L 28 86 L 28 62 Z" fill="#ffffff"/>
    <path d="M 17 61 L 50 39 L 83 61" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- House Window (4 Panes) -->
    <rect x="42" y="65" width="16" height="14" rx="2" fill="#059669"/>
    <line x1="50" y1="65" x2="50" y2="79" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="42" y1="72" x2="58" y2="72" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Typography: RentHere -->
  <text x="122" y="68" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="52" letter-spacing="-1.5">
    <tspan fill="#1A2536">Rent</tspan><tspan fill="#10B981">Here</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <g transform="translate(122, 92)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#10B981" stroke-width="2"/>
    <text x="43" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#1A2536" letter-spacing="2.5">FIND. CONNECT. MOVE IN.</text>
    <line x1="222" y1="0" x2="257" y2="0" stroke="#10B981" stroke-width="2"/>
  </g>
</svg>
